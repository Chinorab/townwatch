<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="'Public Sans', 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Townwatch architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#16181d"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #16181d; stroke-width: 1.5; }
      .band { fill: none; stroke: #d9d9d4; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .h { font-family: Georgia, 'Times New Roman', serif; font-weight: 700; font-size: 19px; fill: #16181d; }
      .n { font-family: Georgia, 'Times New Roman', serif; font-weight: 700; font-size: 19px; fill: #a8232c; }
      .tag { font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; fill: #a8232c; }
      .t { font-size: 13px; fill: #4a4f59; }
      .lbl { font-size: 12px; fill: #4a4f59; }
      .line { stroke: #16181d; stroke-width: 1.5; fill: none; }
      .stat { font-family: Georgia, 'Times New Roman', serif; font-weight: 700; font-size: 26px; fill: #16181d; }
    </style>
  </defs>

  <rect width="1200" height="900" fill="#fafaf8"/>
  <rect x="40" y="70" width="1120" height="3" fill="#a8232c"/>
  <text x="40" y="52" class="h" font-size="28">Townwatch architecture</text>
  <text x="1160" y="52" class="lbl" text-anchor="end">Name a US county or town. Get a sourced briefing of what its boards are deciding.</text>

  <!-- Serving layer -->
  <rect x="40" y="100" width="340" height="140" class="box"/>
  <text x="60" y="132" class="h">Reader's browser</text>
  <text x="60" y="158" class="t">Place search and briefing pages.</text>
  <text x="60" y="180" class="t">Near you: the address is geocoded here</text>
  <text x="60" y="200" class="t">(Census geocoder), never sent to Townwatch.</text>
  <text x="60" y="222" class="t">Drives a new analysis step by step.</text>

  <rect x="430" y="100" width="340" height="140" class="box"/>
  <text x="450" y="132" class="h">Next.js 16 on Vercel</text>
  <text x="450" y="158" class="t">GET /api/places, /api/briefings/{place}</text>
  <text x="450" y="180" class="t">POST /api/analyses, /api/analyses/{id}/advance</text>
  <text x="450" y="200" class="t">One bounded step per request (under 300 s).</text>
  <text x="450" y="222" class="t">API keys live here, server side only.</text>

  <rect x="820" y="100" width="340" height="140" class="box"/>
  <text x="840" y="132" class="h">Upstash Redis</text>
  <text x="840" y="158" class="t">Cache keyed by content hash: no document,</text>
  <text x="840" y="180" class="t">triage or explanation is paid for twice.</text>
  <text x="840" y="200" class="t">Job state, spend ledger, visitor limits.</text>
  <text x="840" y="222" class="t">Stored briefings load with no model call.</text>

  <line x1="382" y1="170" x2="428" y2="170" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="772" y1="170" x2="818" y2="170" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="600" y1="242" x2="600" y2="316" class="line" marker-end="url(#arrow)"/>

  <!-- Pipeline band -->
  <rect x="24" y="290" width="1152" height="440" class="band"/>
  <rect x="40" y="281" width="250" height="18" fill="#fafaf8"/>
  <text x="48" y="295" class="lbl" font-weight="700">ANALYSIS PIPELINE · src/pipeline</text>

  <!-- Row 1 -->
  <rect x="40" y="320" width="262" height="160" class="box"/>
  <text x="58" y="350" class="n">1</text><text x="78" y="350" class="h">Discover</text>
  <text x="58" y="372" class="tag">TAVILY SEARCH</text>
  <text x="58" y="398" class="t">Finds candidate agenda pages for</text>
  <text x="58" y="418" class="t">the county or town board, school</text>
  <text x="58" y="438" class="t">board and planning board.</text>
  <text x="58" y="458" class="t">No per-city configuration.</text>

  <rect x="326" y="320" width="262" height="160" class="box"/>
  <text x="344" y="350" class="n">2</text><text x="364" y="350" class="h">Verify</text>
  <text x="344" y="372" class="tag">NEMOTRON 3 NANO 30B</text>
  <text x="344" y="398" class="t">Official? Right place? Right body?</text>
  <text x="344" y="418" class="t">Then code checks the state in the</text>
  <text x="344" y="438" class="t">domain and in the letterhead, and</text>
  <text x="344" y="458" class="t">ranks the agenda pages first.</text>

  <rect x="612" y="320" width="262" height="160" class="box"/>
  <text x="630" y="350" class="n">3</text><text x="650" y="350" class="h">Read</text>
  <text x="630" y="372" class="tag">TAVILY MAP + EXTRACT</text>
  <text x="630" y="398" class="t">Legistar and CivicClerk: their</text>
  <text x="630" y="418" class="t">public APIs. Other sites: Tavily</text>
  <text x="630" y="438" class="t">Map one hop, then Extract. PDFs</text>
  <text x="630" y="458" class="t">read page by page for citations.</text>

  <rect x="898" y="320" width="262" height="160" class="box"/>
  <text x="916" y="350" class="n">4</text><text x="936" y="350" class="h">Split</text>
  <text x="916" y="372" class="tag">DETERMINISTIC CODE</text>
  <text x="916" y="398" class="t">Agenda text cut into items,</text>
  <text x="916" y="418" class="t">numbered exactly as in the</text>
  <text x="916" y="438" class="t">document, with the page each</text>
  <text x="916" y="458" class="t">item starts on.</text>

  <line x1="302" y1="400" x2="324" y2="400" class="line" marker-end="url(#arrow)"/>
  <line x1="588" y1="400" x2="610" y2="400" class="line" marker-end="url(#arrow)"/>
  <line x1="874" y1="400" x2="896" y2="400" class="line" marker-end="url(#arrow)"/>
  <polyline points="1029,480 1029,505 143,505 143,528" class="line" marker-end="url(#arrow)"/>

  <!-- Row 2 -->
  <rect x="40" y="530" width="206" height="180" class="box"/>
  <text x="56" y="560" class="n">5</text><text x="76" y="560" class="h">Triage</text>
  <text x="56" y="582" class="tag">NEMOTRON 3 NANO 30B</text>
  <text x="56" y="608" class="t">Every item, 10 per</text>
  <text x="56" y="628" class="t">request, thinking off.</text>
  <text x="56" y="648" class="t">Topic, decision or not,</text>
  <text x="56" y="668" class="t">impact, places named.</text>

  <rect x="268" y="530" width="206" height="180" class="box"/>
  <text x="284" y="560" class="n">6</text><text x="304" y="560" class="h">Route</text>
  <text x="284" y="582" class="tag">DETERMINISTIC RULES</text>
  <text x="284" y="608" class="t">Routine never goes up.</text>
  <text x="284" y="628" class="t">Decisions with impact,</text>
  <text x="284" y="648" class="t">or on a chosen topic, do.</text>
  <text x="284" y="668" class="t">Cap: 25%, at most 12.</text>

  <rect x="496" y="530" width="206" height="180" class="box"/>
  <text x="512" y="560" class="n">7</text><text x="532" y="560" class="h">Explain</text>
  <text x="512" y="582" class="tag">NEMOTRON 3 ULTRA 550B</text>
  <text x="512" y="608" class="t">What is decided, by</text>
  <text x="512" y="628" class="t">whom, when, how to take</text>
  <text x="512" y="648" class="t">part. Cited by item.</text>
  <text x="512" y="672" class="tag">FALLBACK: SUPER 120B</text>
  <text x="512" y="692" class="t">on timeout or no JSON.</text>

  <rect x="724" y="530" width="206" height="180" class="box"/>
  <text x="740" y="560" class="n">8</text><text x="760" y="560" class="h">Ground</text>
  <text x="740" y="582" class="tag">DETERMINISTIC CHECKS</text>
  <text x="740" y="608" class="t">Quote found in source,</text>
  <text x="740" y="628" class="t">numbers match it, no</text>
  <text x="740" y="648" class="t">opinion words. Failing</text>
  <text x="740" y="668" class="t">sentences are dropped.</text>

  <rect x="952" y="530" width="208" height="180" class="box"/>
  <text x="968" y="560" class="n">9</text><text x="988" y="560" class="h">Assemble</text>
  <text x="968" y="582" class="tag">BRIEFING</text>
  <text x="968" y="608" class="t">Stories, the rest of the</text>
  <text x="968" y="628" class="t">agenda, calendar, cost</text>
  <text x="968" y="648" class="t">panel. Places named are</text>
  <text x="968" y="668" class="t">mapped (Nominatim).</text>

  <line x1="246" y1="620" x2="266" y2="620" class="line" marker-end="url(#arrow)"/>
  <line x1="474" y1="620" x2="494" y2="620" class="line" marker-end="url(#arrow)"/>
  <line x1="702" y1="620" x2="722" y2="620" class="line" marker-end="url(#arrow)"/>
  <line x1="930" y1="620" x2="950" y2="620" class="line" marker-end="url(#arrow)"/>

  <!-- Measured -->
  <text x="40" y="772" class="lbl" font-weight="700">MEASURED ON THE THREE DEMO PLACES (OCTOBER 2026, ESTIMATED TOKEN FACTORY PRICES)</text>
  <rect x="40" y="782" width="1120" height="1" fill="#d9d9d4"/>
  <text x="40" y="826" class="stat">191 items</text>
  <text x="40" y="850" class="t">sorted by Nano for $0.010 in total</text>
  <text x="320" y="826" class="stat">29 explained</text>
  <text x="320" y="850" class="t">by Ultra: 15% of items</text>
  <text x="600" y="826" class="stat">97% of cost</text>
  <text x="600" y="850" class="t">is Ultra, mostly reasoning tokens</text>
  <text x="880" y="826" class="stat">$0.08 to $0.18</text>
  <text x="880" y="850" class="t">per place, then $0 to read again</text>
</svg>
